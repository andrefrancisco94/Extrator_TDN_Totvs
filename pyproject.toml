[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extrator-tdn-totvs"
version = "0.7.0"
description = "Extrator de documentação Confluence/TDN TOTVS para PDF consolidado"
authors = [{name = "Andre", email = "andre.fco94@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.60.0",
    "beautifulsoup4>=4.14.3",
    "pypdf>=6.12.1",
    "typer>=0.25.1",
    "rich>=15.0.0",
    "colorama>=0.4.6",
    "tenacity>=9.1.4",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
extrator-tdn = "src.main:app"

[project.urls]
Homepage = "https://github.com/andrefco94/Extrator_TDN_Totvs"
Changelog = "https://github.com/andrefco94/Extrator_TDN_Totvs/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
